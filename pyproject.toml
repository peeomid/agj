[project]
name = "agj"
version = "0.1.1"
description = "CLI to locate Codex/Claude processes and activate iTerm2 panes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["cli", "iterm2", "agents", "codex", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "iterm2>=2.9",
    "prompt_toolkit>=3.0.48",
    "psutil>=5.9.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[project.scripts]
agj = "agj.main:main"

[project.urls]
Homepage = "https://osimify.com/projects/agj/"
Repository = "https://github.com/peeomid/agj"
Issues = "https://github.com/peeomid/agj/issues"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["agj"]

[tool.hatch.build.targets.sdist]
include = [
    "agj",
    "agj/error_patterns.txt",
    "agj/permission_patterns.txt",
    "agj.png",
    "notification.png",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
